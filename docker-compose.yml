services:
  mongodb:
    image: mongo:7.0
    container_name: drone-portal-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  backend:
    build:
      context: ./backend
    container_name: drone-portal-backend
    restart: always
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/drone_research_portal
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - '5000:5000'
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: drone-portal-frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
